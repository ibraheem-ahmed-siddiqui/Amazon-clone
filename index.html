<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Amazon</title>
</head>

<body>

    <!-- Header -->
    <header>

        <!-- Navigation Bar -->
        <nav class="navbar">

            <!-- Amazon Logo -->
            <a class="logo" href="https://www.amazon.com" target="_blank">
                <img id="logoimg" class="hoverborder" src="media/amazon_logo.png.png" alt="amazon">
            </a>

            <!-- Loction Box -->
            <span id="locationbox" class="hoverborder">
                <p id="deliverto">Deliver to</p>
                <p><i id="location" class="fa-solid fa-location-dot"></i>Pakistan</p>
            </span>

            <!-- SearchBar -->
            <input class="searchbar" type="text">
            
            <select name="language" id="languageSelector">
                <option value="English">EN</option>
            </select>

        </nav>

        <nav class="secondaryNavbar">

            <span class="secondaryAnchors hoverborder" >
                <p>
                <i class="fa-solid fa-bars"></i>
                All</p>
            </span>

            <a class="secondaryAnchors hoverborder" href="#">Today's Deals</a>
            <a class="secondaryAnchors hoverborder" href="#">Prime Video</a>
            <a class="secondaryAnchors hoverborder" href="#">Gift Cards</a>
            <a class="secondaryAnchors hoverborder" href="#">Sell</a>
            <a class="secondaryAnchors hoverborder" href="#">Customer Service</a>
            <a class="secondaryAnchors hoverborder" href="#">Registry</a>

        </nav>
    </header>
</body>

</html>
